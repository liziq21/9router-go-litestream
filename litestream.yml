# Litestream v0.5+ 通用单数据库配置。
# LITESTREAM_DB_PATH 和 LITESTREAM_REPLICA_URL 由 entrypoint.sh 设置。
# 凭据可使用 LITESTREAM_* 或标准 AWS_* 环境变量。

# Keep startup and restore diagnostics visible in platform logs. Set
# LITESTREAM_LOG_LEVEL=debug (or trace) for more detail on a deployment.
logging:
  level: info
  type: text
  source: true

# 优雅停机同步配置
shutdown-sync-timeout: 30s
shutdown-sync-interval: 500ms

# Keep a recent full snapshot so a fresh instance does not need to replay a
# long L0/L1 history before the application can bind its health-check port.
snapshot:
  interval: 1h
  retention: 1h

# The custom Litestream build falls back from DeleteObjects to DeleteObject,
# which is required by providers that only implement the single-object API.
# Disable this only when the provider does not permit deleting old objects.
retention:
  enabled: true

# 默认每 15 秒会执行一次 ListObjectsV2。降低频率以减少有交易上限的
# S3 兼容存储的请求量；恢复/提高存储端额度仍是解除 403 的必要条件。
l0-retention-check-interval: 1h

dbs:
  - path: ${LITESTREAM_DB_PATH}
    # v0.5.6+: 启动时若本地数据库不存在，自动从远程副本恢复
    restore-if-db-not-exists: true

    replica:
      # S3 兼容协议，支持 Cloudflare R2
      # 可直接通过环境变量 LITESTREAM_REPLICA_URL 传入完整的 s3:// 链接。
      url: ${LITESTREAM_REPLICA_URL}
      # v0.5.7+: 自动恢复异常
      auto-recover: true
